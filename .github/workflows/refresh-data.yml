# Nightly data refresh (plus Wed-Fri evenings for the injury reports): download nflverse, rebuild data/ and
# web/roster_grader.html, run the tests, and commit the result to main only if something changed. Not generated by
# app_builder (app.yml is); edit this one here.
#
# Two jobs, so the write token never meets third-party code:
#   build    contents: read. npm ci, downloads, model, tests, page build. Hands over ONLY the generated files.
#   publish  contents: write. No npm, no downloads. Checks the hand-over holds only the expected files, commits,
#            and pushes with the token supplied to that one step.
# Any failure (a required source unavailable, a test, the build, a push race) stops before the commit, so the last
# good page stays live. Optional sources that fail keep their last good copy (pipeline/refresh.ts) and the page
# footer says so.
name: refresh-data

on:
  schedule:
    - cron: '7 6 * * *'   # 06:07 UTC = 1:07 AM EST (2:07 AM EDT); before the index refresh at 06:47 UTC
    # Evening refresh for the injury reports: Wed-Fri at 7:13 PM America/New_York. Cron runs in UTC, so both
    # offsets are listed and the gate job keeps only the one that is 7 PM in New York that day:
    # EDT (summer) 23:13 UTC Wed-Fri; EST (winter) 00:13 UTC Thu-Sat.
    - cron: '13 23 * * 3,4,5'
    - cron: '13 0 * * 4,5,6'
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  # The evening crons fire in both seasons' UTC slots; run only the one that is 19:xx in New York. A run GitHub
  # delays past 8 PM is skipped (the nightly run still comes). Nightly and manual runs always go ahead.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      run: ${{ steps.when.outputs.run }}
      kind: ${{ steps.when.outputs.kind }}
    steps:
      - id: when
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          run=true
          kind=nightly
          if [ "$SCHEDULE" = '13 23 * * 3,4,5' ] || [ "$SCHEDULE" = '13 0 * * 4,5,6' ]; then
            kind=evening
            hour=$(TZ=America/New_York date +%H)
            if [ "$hour" != 19 ]; then run=false; echo "Not 7 PM in New York (hour $hour): skipping this slot."; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Download nflverse and rebuild data/
        run: npm run refresh
      - run: npm run typecheck
      - run: npm test
      - name: Build the public page
        run: npm run build:web
      - name: Stage the generated files (and nothing else)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          mkdir -p "$out/web"
          cp -R data "$out/data"
          cp web/roster_grader.html "$out/web/roster_grader.html"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refresh
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [gate, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}   # the commit the build job built from
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refresh
          path: ${{ runner.temp }}/in
      - name: Accept only the expected files
        run: |
          set -euo pipefail
          in="$RUNNER_TEMP/in"
          bad=$(cd "$in" && find . \( -type f -o -type l \) ! -regex '\./data/[a-z_]+\.json' ! -regex '\./data/sources/[a-z_]+\.json' ! -path './web/roster_grader.html' -print)
          if [ -n "$bad" ]; then
            echo "::error::unexpected files in the build output (listed below)"
            printf '%q\n' "$bad" >&2
            exit 1
          fi
          if [ -n "$(find "$in" -type l -print -quit)" ]; then echo "::error::symlinks in the build output"; exit 1; fi
          if [ -n "$(find "$in" -type f -size +20M -print -quit)" ]; then echo "::error::a file over 20 MB in the build output"; exit 1; fi
          for f in "$in/data/roster_grader.json" "$in/web/roster_grader.html"; do
            if [ ! -s "$f" ]; then echo "::error::missing or empty: ${f#"$in"/}"; exit 1; fi
          done
          while IFS= read -r -d '' f; do
            if [ ! -s "$f" ] || ! jq empty "$f"; then echo "::error::not valid JSON: ${f#"$in"/}"; exit 1; fi
          done < <(find "$in/data" -name '*.json' -print0)
          mkdir -p data web
          cp -R "$in/data/." data/
          cp "$in/web/roster_grader.html" web/roster_grader.html
      - name: Commit and push if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ needs.gate.outputs.kind }}
        run: |
          set -euo pipefail
          git add data web/roster_grader.html
          if git diff --cached --quiet; then echo "No changes; nothing to commit."; exit 0; fi
          git -c user.name="roster-grader-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "data: ${KIND:-nightly} refresh $(date -u +%F)"
          # The token is used for this push only; it is never written to .git/config.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # Fails (and commits nothing to main) if main moved since the build; the next night retries.
          git -c "http.https://github.com/.extraheader=$auth" push origin HEAD:refs/heads/main
          echo "Pushed $(git rev-parse --short HEAD) to main."
